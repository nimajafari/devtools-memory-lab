name: Memory check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  memory-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Some npm setups skip install scripts, so download Chrome explicitly.
      - name: Install Chrome for Testing
        run: npx puppeteer browsers install

      # Ubuntu 23.10 and later restrict the user namespaces that the Chrome sandbox needs.
      - name: Allow the Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Run memory regression tests
        run: npm test
